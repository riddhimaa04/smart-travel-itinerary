<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - TripEase</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== NAVIGATION BAR (filled by js/layout.js) ===== -->
  <header class="navbar" id="site-header"></header>

  <main>
    <!-- ===== PAGE HEADING ===== -->
    <section class="page-header">
      <div class="container">
        <h1>Create an Account</h1>
        <p>Sign up to start planning and saving your trips.</p>
      </div>
    </section>

    <section class="container section-small">

      <!-- ===== REGISTER FORM ===== -->
      <form id="register-form" class="panel auth-panel" novalidate>
        <div class="form-group">
          <label for="register-name">Full name</label>
          <input type="text" id="register-name">
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="register-password">Password (at least 6 characters)</label>
          <input type="password" id="register-password">
        </div>
        <div class="form-group">
          <label for="register-confirm">Confirm password</label>
          <input type="password" id="register-confirm">
        </div>
        <p id="register-message" class="error-text"></p>
        <button type="submit" class="button button-full">Create Account</button>
        <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
      </form>
    </section>
  </main>

  <!-- ===== FOOTER (filled by js/layout.js) ===== -->
  <footer class="footer" id="site-footer"></footer>

  <!-- ===== JAVASCRIPT (data first, then helpers, then this page's own script) ===== -->
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
